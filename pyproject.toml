[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-agent"
version = "0.1.0"
description = "AI backend for AI Incident Investigator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi",
    "httpx",
    "langgraph",
    "mcp",
    "pydantic-settings",
    "uvicorn",
]

[dependency-groups]
dev = ["jsonschema", "pytest", "rfc3339-validator", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
